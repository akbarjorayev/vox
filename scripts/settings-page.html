<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vox settings</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --text: #1c1c1a; --muted: #6b6b66;
    --line: #dcdcd6; --accent: #2f5fd0; --accent-text: #ffffff; --ok: #1f7a3d; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1f1f1d; --text: #ececE8; --muted: #9a9a93;
      --line: #34342f; --accent: #7aa2ff; --accent-text: #0c1020; --ok: #6fd18b; --bad: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  label { display: block; margin: 0 0 6px; font-weight: 600; font-size: 14px; }
  .field { margin-bottom: 22px; }
  select { width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .speed-row { display: flex; align-items: center; gap: 12px; }
  .speed-value { min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  label.check { display: flex; align-items: center; gap: 10px; font-weight: 500; cursor: pointer; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .hints { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .actions { display: flex; gap: 10px; margin-top: 8px; }
  button { flex: 1; padding: 11px 14px; font: inherit; font-weight: 600; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { min-height: 22px; margin: 16px 0 0; font-size: 14px; color: var(--muted); }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Vox settings</h1>
  <p class="sub">Choose how Vox sounds.</p>

  <div class="field">
    <label for="voice">Voice</label>
    <select id="voice"></select>
  </div>

  <div class="field">
    <label for="speed">Speed</label>
    <div class="speed-row">
      <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1">
      <span id="speed-value" class="speed-value">1.00×</span>
    </div>
    <div class="hints"><span>Slower</span><span>Faster</span></div>
  </div>

  <div class="field">
    <label class="check"><input id="auto" type="checkbox"> Read every reply aloud automatically</label>
  </div>

  <div class="actions">
    <button id="preview" type="button">Preview</button>
    <button id="save" type="button" class="primary">Save</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
</main>

<script>
  const voice = document.getElementById('voice');
  const speed = document.getElementById('speed');
  const speedValue = document.getElementById('speed-value');
  const auto = document.getElementById('auto');
  const previewButton = document.getElementById('preview');
  const saveButton = document.getElementById('save');
  const status = document.getElementById('status');

  function say(text, kind = '') {
    status.textContent = text;
    status.className = kind;
  }

  function showSpeed() {
    speedValue.textContent = Number(speed.value).toFixed(2) + '×';
  }

  function current() {
    return { voice: voice.value, speed: Number(speed.value), auto: auto.checked };
  }

  async function request(path, body) {
    const options = body
      ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
      : undefined;
    const response = await fetch(path, options);
    if (!response.ok) throw new Error('request failed');
    return response.json();
  }

  async function run(button, work, failure) {
    button.disabled = true;
    try {
      await work();
    } catch {
      say(failure, 'bad');
    } finally {
      button.disabled = false;
    }
  }

  async function load() {
    const { settings, voices } = await request('api/settings');
    for (const item of voices) {
      voice.add(new Option(item.label, item.id));
    }
    if (!voices.some((item) => item.id === settings.voice)) {
      voice.add(new Option(settings.voice, settings.voice));
    }
    voice.value = settings.voice;
    speed.value = settings.speed;
    auto.checked = settings.auto;
    showSpeed();
  }

  speed.addEventListener('input', showSpeed);

  previewButton.addEventListener('click', () =>
    run(previewButton, async () => {
      say('Playing a sample…');
      await request('api/preview', current());
      say('');
    }, "Couldn't play the sample."),
  );

  saveButton.addEventListener('click', () =>
    run(saveButton, async () => {
      await request('api/save', current());
      previewButton.disabled = true;
      saveButton.disabled = true;
      say('Saved. You can close this tab.', 'ok');
    }, "Couldn't save. Please try again."),
  );

  load().catch(() => say("Couldn't load your settings. Close this tab and open the page again.", 'bad'));
</script>
</body>
</html>
